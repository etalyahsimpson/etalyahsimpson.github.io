<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PolicyGuard AI — Enterprise AI Response Evaluation and Agent Security Workbench">
  <defs>
    <linearGradient id="pg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C2D"/>
    </linearGradient>
    <pattern id="pg-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.45"/>
    </pattern>
    <linearGradient id="pg-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164E63"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#pg-bg)"/>
  <rect width="1280" height="360" fill="url(#pg-grid)"/>
  <rect x="0" y="356" width="1280" height="4" fill="#0891B2"/>

  <!-- Shield + verification mark -->
  <g transform="translate(96,78)">
    <path d="M64 6 L118 28 V92 C118 138 96 168 64 184 C32 168 10 138 10 92 V28 Z"
          fill="url(#pg-shield)" stroke="#0891B2" stroke-width="3"/>
    <path d="M40 92 L58 114 L92 66" fill="none" stroke="#DBEAFE" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="118" cy="28" r="13" fill="#15803D" stroke="#0B1220" stroke-width="3"/>
    <path d="M112 28 L116.5 33 L124 23" fill="none" stroke="#F8FAFC" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="286" y="140" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="58" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">PolicyGuard AI</text>
  <text x="288" y="184" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="23" fill="#94A3B8">Enterprise AI Response Evaluation &amp; Agent Security Workbench</text>
  <rect x="290" y="210" width="96" height="4" rx="2" fill="#0891B2"/>
  <text x="288" y="252" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="16" fill="#64748B">Deterministic evaluation engine · Shared by web, REST API, MCP and CI</text>

  <!-- Evaluation check stack -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <g transform="translate(880,84)">
      <rect width="304" height="52" rx="8" fill="#111C2D" stroke="#1E293B"/>
      <circle cx="30" cy="26" r="12" fill="#15803D"/>
      <path d="M24 26 L28.5 30.5 L36.5 21.5" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="23" font-size="15" fill="#F8FAFC" font-weight="600">Required policy information</text>
      <text x="54" y="40" font-size="11.5" fill="#64748B">asserted facts verified against the corpus</text>
      <text x="282" y="31" font-size="13" fill="#15803D" font-weight="700" text-anchor="end">PASS</text>
    </g>
    <g transform="translate(880,148)">
      <rect width="304" height="52" rx="8" fill="#111C2D" stroke="#1E293B"/>
      <circle cx="30" cy="26" r="12" fill="#15803D"/>
      <path d="M24 26 L28.5 30.5 L36.5 21.5" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="23" font-size="15" fill="#F8FAFC" font-weight="600">Citation integrity</text>
      <text x="54" y="40" font-size="11.5" fill="#64748B">current, existing, allowlisted documents</text>
      <text x="282" y="31" font-size="13" fill="#15803D" font-weight="700" text-anchor="end">PASS</text>
    </g>
    <g transform="translate(880,212)">
      <rect width="304" height="52" rx="8" fill="#111C2D" stroke="#7F1D1D"/>
      <circle cx="30" cy="26" r="12" fill="#B91C1C"/>
      <path d="M24.5 24 L35.5 33 M35.5 24 L24.5 33" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
      <text x="54" y="23" font-size="15" fill="#F8FAFC" font-weight="600">Tool action authorization</text>
      <text x="54" y="40" font-size="11.5" fill="#64748B">default-deny permission matrix · PERM-006</text>
      <text x="282" y="31" font-size="13" fill="#B91C1C" font-weight="700" text-anchor="end">DENY</text>
    </g>
  </g>
</svg>
